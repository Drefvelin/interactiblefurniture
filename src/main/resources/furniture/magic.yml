pedestal:
  item: "ia.tfmc:pedestal"
  model:
    display: item_display
    model: ia.tfmc:pedestal
  placement_options:
    floor: true
  rotate: true
  pickup: true
  sound:
    place: block.stone.place
    break: block.stone.break
  slots:
    templates:
      pan_slot:
        whitelist:
          - "item"
        display:
          rotation:
            x: 0
            y: 90
            z: 0
          scale:
            x: 0.6
            y: 0.6
            z: 0.6
          position:
            x: 0
            y: -0.1
            z: 0
    center:
      left:
        template: pan_slot
        offset:
          x: 0.2
          y: 0
          z: 0
      right:
        template: pan_slot
        offset:
          x: -0.2
          y: 0
          z: 0
      butter:
        interactible: false
        template: pan_slot
        offset:
          x: 0
          y: 0.13
          z: 0
        display:
          rotation:
            x: 0
            y: 0
            z: 0
          scale:
            x: 0.8
            y: 0.8
            z: 0.8